name: Native v1.1 release candidate
on:
  pull_request:
    branches: [main]
  push:
    branches: [release/v1.1.0-final]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build native Portable and bilingual Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE) { throw 'Inno compiler installation failed' }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw 'Redistributable CRT directory missing' }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          .\package-native.ps1 -OutputDirectory "$env:RUNNER_TEMP\native-release" -VCRuntimeDirectory $crt.FullName -BuildInstaller -IsccPath $iscc
      - name: Verify both installer languages and preserve user files
        shell: pwsh
        run: .\tests\Test-NativeReleasePackaging.ps1 -PortableDirectory "$env:RUNNER_TEMP\native-release\portable" -SetupExe "$env:RUNNER_TEMP\native-release\AMIEBL-v1.1.0-win-x64-setup.exe"
      - name: Exercise packaged GUI and Core
        shell: pwsh
        run: |
          python -m pip install -r backend/requirements.txt
          if ($LASTEXITCODE) { throw 'Test dependency installation failed' }
          $env:AMIEBL_NATIVE_OUTPUT_DIR = "$env:RUNNER_TEMP\native-release\portable"
          $env:AMIEBL_GUI_EXECUTABLE = "$env:AMIEBL_NATIVE_OUTPUT_DIR\LocalModelManager.exe"
          $env:CARGO_TARGET_DIR = "$env:RUNNER_TEMP\packaged-core"
          New-Item -ItemType Directory "$env:CARGO_TARGET_DIR\debug" -Force | Out-Null
          Copy-Item "$env:AMIEBL_NATIVE_OUTPUT_DIR\amiebl-core.exe" "$env:CARGO_TARGET_DIR\debug\amiebl-core.exe"
          $env:AMIEBL_REQUIRE_GUI_TESTS = '1'
          $env:AMIEBL_REQUIRE_NATIVE_TESTS = '1'
          python -m unittest discover -s tests -p test_native_gui_integration.py -v
          if ($LASTEXITCODE) { throw 'Packaged GUI acceptance failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: native-v1.1.0-candidate
          path: |
            ${{ runner.temp }}/native-release/*.zip
            ${{ runner.temp }}/native-release/*.exe
            ${{ runner.temp }}/native-release/SHA256SUMS.txt
          retention-days: 14
