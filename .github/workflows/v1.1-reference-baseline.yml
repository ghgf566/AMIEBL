name: v1.1.0 migration — frozen v1.0.0 baseline

on:
  push:
    branches: [refactor/v1.1.0-rust-cpp-winui3]
  workflow_dispatch:

concurrency:
  group: v11-reference-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frozen-reference-tests:
    # Deliberately named "frozen reference": green is NOT Rust/C++ parity.
    name: Frozen Python/C# reference regression (not migration complete)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install reference API test dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run native Rust core unit tests
        run: cargo test --locked --manifest-path native-core/Cargo.toml
      - name: Compile Rust configuration differential-test probe
        run: cargo build --locked --manifest-path native-core/Cargo.toml --bin config-probe
      - name: Compare Rust config behavior with Python v1.0.0
        run: python -m unittest discover -s tests -p "test_native_config_parity.py" -v
      - name: Compile native VS Code compatibility probe
        run: cargo build --locked --manifest-path native-core/Cargo.toml --bin vscode-probe
      - name: Compare Rust VS Code sync, Agents and backups with Python v1.0.0
        run: python -m unittest discover -s tests -p "test_native_vscode_parity.py" -v
      - name: Compile native GGUF metadata probe
        run: cargo build --locked --manifest-path native-core/Cargo.toml --bin gguf-probe
      - name: Compare Rust GGUF and reasoning against Python v1.0.0
        run: python -m unittest discover -s tests -p "test_native_gguf_parity.py" -v
      - name: Compile native inference request policy probe
        run: cargo build --locked --manifest-path native-core/Cargo.toml --bin request-probe
      - name: Compare native request validation, profiles, sampling and thinking policy
        env:
          AMIEBL_REQUIRE_NATIVE_TESTS: '1'
        run: python -m unittest discover -s tests -p "test_native_request_parity.py" -v
      - name: Compile isolated Rust HTTP preview
        run: cargo build --locked --manifest-path native-core/Cargo.toml --bin amiebl-core-preview
      - name: Verify loopback-only preview, admin token and safe data directory
        run: python -m unittest discover -s tests -p "test_native_http_preview.py" -v
      - name: Check frozen reference route and navigation inventory
        run: python -m unittest discover -s tests -p "test_v11_baseline_inventory.py" -v
      - name: Execute the original regression test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Verify editor state, drafts and typed UI settings
        run: dotnet run --project tests/DesktopCoreRegression -c Release
      - name: Verify desktop process and data handling
        run: dotnet run --project tests/DesktopPlatformRegression -c Release
      - name: State release limitation
        shell: pwsh
        run: Write-Host 'REFERENCE TESTS ONLY. Rust HTTP parity, C++/WinRT GUI parity and clean Windows runtime installation are NOT YET verified.'
