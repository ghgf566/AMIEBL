name: v1.1.0 migration — frozen v1.0.0 baseline

on:
  push:
    branches: [refactor/v1.1.0-rust-cpp-winui3]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-reference-tests:
    # Deliberately named "frozen reference": green is NOT Rust/C++ parity.
    name: Frozen Python/C# reference regression (not migration complete)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install reference API test dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Check frozen reference route and navigation inventory
        run: python -m unittest discover -s tests -p "test_v11_baseline_inventory.py" -v
      - name: Execute the original regression test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Verify editor state, drafts and typed UI settings
        run: dotnet run --project tests/DesktopCoreRegression -c Release
      - name: Verify desktop process and data handling
        run: dotnet run --project tests/DesktopPlatformRegression -c Release
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run native Rust core unit tests
        run: cargo test --manifest-path native-core/Cargo.toml
      - name: State release limitation
        shell: pwsh
        run: Write-Host 'REFERENCE TESTS ONLY. Rust HTTP parity, C++/WinRT GUI parity and clean Windows runtime installation are NOT YET verified.'
