[package]
name = "amiebl-core"
version = "1.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "amiebl_core"
path = "src/lib.rs"

[dependencies]
serde = "1.0"
serde_json = "1.0"
regex = "1.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tempfile = "3.23"
uuid = { version = "1.18", features = ["v4"] }
axum = "0.8"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "net", "signal"] }
subtle = "2.6"
